<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GATE Tracker</title>
<meta name="theme-color" content="#f4f5f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GATE">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script>
  let t = 'light'; try { t = localStorage.getItem('theme') || 'light'; } catch {} document.documentElement.dataset.theme = t;
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <span class="logo" aria-hidden="true">✓</span>
  <div class="topbar-title" id="topTitle">GATE</div>
  <button class="iconbtn accent" id="topAdd" aria-label="Quick add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</header>
<div class="shell">
  <nav class="side" id="sidenav" aria-label="Main">
    <div class="brand"><span class="logo" aria-hidden="true">✓</span> GATE <small>2027</small></div>
    <button class="btn primary wide" id="quickAdd" title="Quick add (press N)">＋ Quick add <kbd>N</kbd></button>
    <ul id="navList"></ul>
    <div class="side-foot">
      <button class="streamswitch" id="streamBtn" title="Switch what you are studying"></button>
      <button class="btn ghost small" id="themeBtn" aria-label="Toggle theme">◐ Theme</button>
      <div id="userLine" class="muted small" style="overflow:hidden;text-overflow:ellipsis"></div>
      <div id="examCount" class="muted small"></div>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="timerBar" class="timerbar" hidden></div>
<nav class="bottomnav" id="bottomNav" aria-label="Main"></nav>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
